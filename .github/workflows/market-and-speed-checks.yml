name: Market settlement and web checks

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "scripts/**"
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/market-and-speed-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "scripts/**"
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/market-and-speed-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sportsbook-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned backend dependencies
        run: npm ci --ignore-scripts
      - name: Match timeline actor names
        run: node scripts/test-protected-event-minutes.mjs
      - name: Every Zizobet match archived without odds
        run: node scripts/test-zizobet-all-match-history.mjs
      - name: Unified all-fixture financial evidence and correction safety
        run: node scripts/test-unified-fixture-evidence.mjs
      - name: Bounded real-time secondary info and AiScore
        run: node scripts/test-realtime-information.mjs
      - name: Elementary FT HT accumulator and settlement recovery
        run: node scripts/test-elementary-settlement-integration.mjs
      - name: Universal native market acceptance versus final grader
        run: node scripts/test-all-market-acceptance-proof.mjs
      - name: Primary verified foul windows and wallet idempotency
        run: node scripts/test-foul-window-reconciliation.mjs
      - name: Simulimi - persisted events and rejection reasons
        run: node scripts/test-simulimi-acceptance.mjs
      - name: Simulimi - offline all-market smoke and combo matrix
        run: npm run simulimi
      - name: Save simulimi report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulimi-report
          path: simulimi-report.json
          if-no-files-found: warn
      - name: Market 01 - english half exact catalog
        if: always()
        run: node scripts/test-english-half-exact-catalog.mjs
      - name: Market 02 - period goal totals
        if: always()
        run: node scripts/test-period-goal-totals.mjs
      - name: Market 03 - half combinations
        if: always()
        run: node scripts/test-half-combinations.mjs
      - name: Market 04 - player goal specials
        if: always()
        run: node scripts/test-player-goal-specials.mjs
      - name: Primary Next/First/Nth/2+ and 3+ scorer market family coverage
        if: always()
        run: node scripts/test-event-family-coverage.mjs
      - name: Two independently verified LIVE payout decisions
        if: always()
        run: node scripts/test-verified-live-settlement.mjs
      - name: Preserve LIVE proposal timestamps across repeated provider polls
        if: always()
        run: node scripts/test-live-preview-anchoring.mjs
      - name: Real SQL ticket-and-wallet flow for LIVE and PREMATCH accumulator
        if: always()
        run: node scripts/test-live-settlement-money-flow.mjs
      - name: Financial safety of timed incidents and player identity
        if: always()
        run: node scripts/test-live-financial-safety.mjs
      - name: Market 05 - player ordinal scorers
        if: always()
        run: node scripts/test-player-ordinal-scorers.mjs
      - name: Market 07 - card sequences
        if: always()
        run: node scripts/test-card-sequences.mjs
      - name: Market 08 - corner comparisons
        if: always()
        run: node scripts/test-corner-comparisons.mjs
      - name: Market 09 - multi corners
        if: always()
        run: node scripts/test-multi-corners.mjs
      - name: Market 10 - parity markets
        if: always()
        run: node scripts/test-parity-markets.mjs
      - name: Market 11 - dc btts
        if: always()
        run: node scripts/test-dc-btts.mjs
      - name: Market 12 - scoring props
        if: always()
        run: node scripts/test-scoring-props.mjs
      - name: Market 13 - half event races
        if: always()
        run: node scripts/test-half-event-races.mjs
      - name: First-half LIVE next/first/last and race card-corner-goal math
        if: always()
        run: node scripts/test-live-first-half-event-acceptance.mjs
      - name: Market 14 - team count markets
        if: always()
        run: node scripts/test-team-count-markets.mjs
      - name: Market 15 - player booking contracts
        if: always()
        run: node scripts/test-player-booking-contracts.mjs
      - name: Market 16 - captured odds store and suspension
        if: always()
        run: node scripts/test-odds-store.mjs
      - name: Market 17 - timed market acceptance
        if: always()
        run: node scripts/test-timed-market-acceptance.mjs
      - name: Market 18 - first half corner settlement
        if: always()
        run: node scripts/test-first-half-corner-settlement.mjs
      - name: Market 19 - team interval contracts
        if: always()
        run: node scripts/test-team-interval-contracts.mjs
      - name: General interval acceptance and 90-0 state machine
        if: always()
        run: node scripts/test-market-state-math.mjs
      - name: SQL settlement of post-purchase goals, corners, cards and fouls
        if: always()
        run: node scripts/test-live-interval-bet-settlement.mjs
      - name: Match alternatives and different-market column arithmetic
        if: always()
        run: node scripts/test-selection-market.mjs && node scripts/test-system-columns.mjs && node scripts/test-betslip-columns.mjs
      - name: Supplemental event and actor rotation archive
        if: always()
        run: node scripts/test-supplemental-incidents.mjs
      - name: FotMob scorer and 1X2 team statistics regression
        if: always()
        run: node scripts/test-fotmob-scorer-enrichment.mjs
      - name: FotMob identity and independent UTC kickoff regression
        if: always()
        run: node scripts/test-fotmob-fixture-mapping.mjs
      - name: FotMob advisory scorer display only on existing Zizobet events
        if: always()
        run: node scripts/test-fotmob-advisory-goal-display.mjs
      - name: Market 20 - race none and aiscore
        if: always()
        run: node scripts/test-race-none-and-aiscore.mjs
      - name: Market 21 - half period totals
        if: always()
        run: node scripts/test-half-period-totals.mjs
      - name: Check read-only audit syntax and package import contracts
        if: always()
        run: |
          node --check scripts/audit-ticket-settlement-integrity.mjs
          node --check scripts/audit-provider-readiness.mjs
          node --check scripts/audit-market-settlement-readiness.mjs
          node --check server/ledger/halftime-results.mjs
          node --check server/ledger/settler.mjs
          node --check server/zizobet/normalize.mjs
          node --check server/stats-providers/adapters.mjs
          node --check scripts/test-halftime-results.mjs
          node --check scripts/test-fixture-name-matching.mjs
      - name: Safe team-name aliases and external fixture identity
        if: always()
        run: node scripts/test-fixture-name-matching.mjs
      - name: Verified half-time settlement and source chronology
        if: always()
        run: node scripts/test-halftime-results.mjs
      - name: Settlement integrity regression across market and result periods
        if: always()
        run: node scripts/test-settlement-market-result-integrity.mjs
      - name: Settlement and provider-history tests
        if: always()
        run: |
          node scripts/test-settlement-results.mjs
          npm run test:historical-settlement
      - name: Cache headless Chrome for statistics UI tests
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: pptr-chrome-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install pinned Puppeteer Chrome
        if: always()
        run: npx puppeteer browsers install chrome
      - name: Real browser test for same-match different markets and alternate outcomes
        if: always()
        run: node scripts/test-betslip-browser.mjs
      - name: Database provider/statistics contract checks
        if: always()
        run: |
          npm run test:primary-goal-display
          npm run test:statistics
      - name: Board subscription and caching checks
        if: always()
        run: |
          npm run test:feed-route
          npm run test:scoped-socket
          npm run test:quote-dedup
          node scripts/test-static-cache.mjs
          node scripts/test-board-speed.mjs
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned frontend dependencies
        run: npm --prefix web ci --ignore-scripts
      - name: Type-check frontend
        run: npm --prefix web run typecheck --if-present
      - name: Build production bundle
        run: npm --prefix web run build
